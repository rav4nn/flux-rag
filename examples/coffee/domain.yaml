domain:
  name: "specialty_coffee"
  description: "Expert knowledge on coffee brewing, extraction, and preparation"

corpus:
  sources:
    - path: "./data/legacy_100.jsonl"
      weight: 1.0
    #- path: "./data/legacy.jsonl"       # full 785 — swap back after sweep
    #  weight: 1.0
    #- path: "./data/documents/"
    #  types: ["pdf", "txt"]
    #  weight: 1.0
  dedup_key: "id"

chunking:
  strategy: "semantic"
  target_tokens: 400
  overlap_sentences: 1

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  strategy: "hybrid_rerank"
  top_k: 5
  rerank_candidates: 20
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"

llm:
  model: "deepseek/deepseek-chat"

eval:
  enabled: true
  qa_pairs_path: "./eval/coffee_qa_15.jsonl"  # 15 pairs for sweep speed; swap to coffee_qa.jsonl for full eval
  judge: "deepseek/deepseek-chat"

# Parameter sweep — run with: fluxrag sweep --config domain.yaml
sweep:
  chunking_strategies: ["fixed", "sentence", "semantic"]
  target_tokens: [200, 400, 600]
  retrieval_strategies: ["dense", "hybrid_rerank"]
  top_k: [5]

benchmark:
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-large-en-v1.5"
    - "nomic-ai/nomic-embed-text-v1.5"
    - "thenlper/gte-large"
    - "openai/text-embedding-3-small"
    - "openai/text-embedding-3-large"
    - "cohere/embed-english-v3.0"
    - "voyage/voyage-3"
  llms:
    - "deepseek/deepseek-chat"
    - "openai/gpt-4o-mini"
    - "google/gemini-2.5-flash"
    - "groq/llama-3.3-70b-versatile"
  rerankers:
    - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    - "BAAI/bge-reranker-v2-m3"
    - "cohere/rerank-english-v3.0"
  budget_limit_usd: 50.0

api:
  host: "0.0.0.0"
  port: 8001
  metadata_filters:
    - "source"
    - "source_type"
