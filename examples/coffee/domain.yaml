domain:
  name: "specialty_coffee"
  description: "Expert knowledge on coffee brewing, extraction, and preparation"

corpus:
  sources:
    - path: "./data/documents/"
      types: ["pdf", "docx", "txt"]
      weight: 1.0
    - path: "./data/youtube_urls.txt"
      type: "youtube"
      weight: 1.0
    - path: "./data/podcasts/"
      types: ["mp3", "wav"]
      transcription_model: "whisper-large-v3"
      weight: 1.0
    - path: "./data/images/"
      types: ["png", "jpg"]
      ocr_engine: "tesseract"
      weight: 0.8
    - path: "./data/legacy.jsonl"
      weight: 1.0
  dedup_key: "id"

chunking:
  strategy: "semantic"
  target_tokens: 200
  overlap_sentences: 1

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"

retrieval:
  strategy: "hybrid_rerank"
  top_k: 5
  rerank_candidates: 20
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"

llm:
  model: "deepseek/deepseek-chat"

eval:
  enabled: true
  qa_pairs_path: "./eval/coffee_qa.jsonl"
  judge: "deepseek/deepseek-chat"

benchmark:
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-large-en-v1.5"
    - "nomic-ai/nomic-embed-text-v1.5"
    - "thenlper/gte-large"
    - "openai/text-embedding-3-small"
    - "openai/text-embedding-3-large"
    - "cohere/embed-english-v3.0"
    - "voyage/voyage-3"
  llms:
    - "anthropic/claude-sonnet-4-20250514"
    - "anthropic/claude-haiku-4-20250414"
    - "openai/gpt-4o"
    - "openai/gpt-4o-mini"
    - "google/gemini-2.5-flash"
    - "google/gemini-2.5-pro"
    - "groq/llama-3.3-70b-versatile"
    - "mistral/mistral-large-latest"
    - "deepseek/deepseek-chat"
  rerankers:
    - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    - "BAAI/bge-reranker-v2-m3"
    - "jinaai/jina-reranker-v2-base-multilingual"
    - "cohere/rerank-english-v3.0"
    - "jina/jina-reranker-v2-base-multilingual"
  budget_limit_usd: 50.0

api:
  host: "0.0.0.0"
  port: 8001
  metadata_filters:
    - "source"
    - "source_type"
    - "brew_method"
    - "topic_category"
