[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxrag"
version = "0.1.0"
description = "Universal ingestion-to-evaluation RAG pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Hardeep", email = "hardeep@metasmic.com" }]

dependencies = [
    # Core
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Ingestion
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.12.0",
    "pandas>=2.2.0",
    "chardet>=5.2.0",
    "pytesseract>=0.3.13",
    "faster-whisper>=1.1.0",
    "yt-dlp>=2024.0",
    "youtube-transcript-api>=0.6.0",
    # Chunking
    "spacy>=3.7.0",
    # Embedding
    "sentence-transformers>=3.0.0",
    "openai>=1.50.0",
    "cohere>=5.0.0",
    "voyageai>=0.2.2",
    # Retrieval
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0",
    "qdrant-client>=1.12.0",
    # LLM
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "groq>=0.11.0",
    "mistralai>=1.0.0",
    # Eval (custom LLM-judge harness — ragas not used at runtime)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
fluxrag = "fluxrag.cli.main:cli"

[tool.setuptools.packages.find]
include = ["fluxrag*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
